spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:travel-planner-backend;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  auth:
    redis:
      enabled: ${APP_AUTH_REDIS_ENABLED:true}
      port: ${APP_REDIS_PORT:6380}
    jwt:
      secret: ${APP_JWT_SECRET:local-development-jwt-secret-change-me-123456}
    email:
      mode: ${APP_EMAIL_MODE:local}
