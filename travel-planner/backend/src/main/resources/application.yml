server:
  port: 8080

spring:
  application:
    name: travel-planner-backend
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB
  http:
    client:
      connect-timeout: 10s
      read-timeout: 45s
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    # 数据源按驱动拆成独立文件：本地 H2（MySQL 兼容模式）、生产 MySQL
    import:
      - optional:classpath:application-local.yml
      - optional:classpath:application-prod.yml
  ai:
    # Spring AI 1.1.x 对应 Spring Boot 3.5.x，密钥只从环境变量读取。
    model:
      # 未配置密钥时禁用模型自动配置，智能体仍可用规则解析降级运行。
      chat: ${SPRING_AI_MODEL_CHAT:none}
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
        temperature: 0.1

app:
  profile:
    avatar-dir: ${APP_PROFILE_AVATAR_DIR:uploads/avatars}
  bootstrap-admin:
    enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
    nickname: ${APP_BOOTSTRAP_ADMIN_NICKNAME:Docker 管理员}
  auth:
    jwt:
      secret: ${APP_JWT_SECRET:}
      issuer: ${APP_JWT_ISSUER:travel-planner}
      access-ttl: ${APP_JWT_ACCESS_TTL:15m}
      refresh-ttl: ${APP_JWT_REFRESH_TTL:7d}
    email-code:
      ttl: ${APP_EMAIL_CODE_TTL:5m}
      retry-after: ${APP_EMAIL_CODE_RETRY_AFTER:60s}
    captcha:
      challenge-ttl: ${APP_CAPTCHA_CHALLENGE_TTL:2m}
      max-login-failures: ${APP_CAPTCHA_LOGIN_FAILURES:1}
      failure-window: ${APP_CAPTCHA_FAILURE_WINDOW:10m}
    rate-limit:
      enabled: ${APP_RATE_LIMIT_ENABLED:true}
      trust-forwarded-header: ${APP_RATE_LIMIT_TRUST_FORWARDED:false}
      general-per-minute: ${APP_RATE_LIMIT_GENERAL:120}
      auth-per-minute: ${APP_RATE_LIMIT_AUTH:60}
      captcha-per-minute: ${APP_RATE_LIMIT_CAPTCHA:20}
    redis:
      # 旧变量 APP_REDIS_ENABLED 不再生效，避免历史 false 值让验证码退回进程内存。
      enabled: ${APP_AUTH_REDIS_ENABLED:true}
      host: ${APP_REDIS_HOST:127.0.0.1}
      port: ${APP_REDIS_PORT:6379}
      password: ${APP_REDIS_PASSWORD:}
      database: ${APP_REDIS_DATABASE:0}
      ssl: ${APP_REDIS_SSL:false}
      timeout: ${APP_REDIS_TIMEOUT:2s}
    email:
      mode: ${APP_EMAIL_MODE:disabled}
      host: ${APP_EMAIL_HOST:smtp.163.com}
      port: ${APP_EMAIL_PORT:465}
      username: ${APP_EMAIL_USERNAME:}
      password: ${APP_EMAIL_PASSWORD:}
      from: ${APP_EMAIL_FROM:}
      ssl-enabled: ${APP_EMAIL_SSL_ENABLED:true}
      starttls-enabled: ${APP_EMAIL_STARTTLS_ENABLED:false}
      connect-timeout: ${APP_EMAIL_CONNECT_TIMEOUT:10s}
      read-timeout: ${APP_EMAIL_READ_TIMEOUT:30s}
      write-timeout: ${APP_EMAIL_WRITE_TIMEOUT:30s}
  chat:
    # 按顺序选择第一个可用模型；没有密钥时自动落到 rule，业务代码不感知。
    providers: ${APP_CHAT_PROVIDERS:spring-ai,rule}
    default-title: ${APP_CHAT_DEFAULT_TITLE:新的旅行对话}
    # {{today}} 会在启动/请求时替换为当天日期；改提示词不需要改 Java。
    system-prompt: |-
      你是旅游规划智能体，负责把用户的口语化旅行需求整理成可执行方案。
      今天是 {{today}}。
      回答要求：
      1. 用简体中文，先确认已知条件，再给建议；
      2. 缺少目的地、天数、人数、预算等关键条件时，一次追问不超过两个问题；
      3. 不编造实时价格、航班、酒店库存和开放时间，涉及事实时说明“以实时查询为准”；
      4. 行程建议按天拆开，控制每天强度，给交通和休息留余量；
      5. 用户提出修改时，先复述要改什么，再给受影响的部分，不要重写整份行程。
    context-messages: ${APP_CHAT_CONTEXT_MESSAGES:20}
    context-char-budget: ${APP_CHAT_CONTEXT_CHAR_BUDGET:12000}
    title-max-length: ${APP_CHAT_TITLE_MAX_LENGTH:30}
    preview-max-length: ${APP_CHAT_PREVIEW_MAX_LENGTH:60}
    max-content-chars: ${APP_CHAT_MAX_CONTENT_CHARS:4000}
    stream-timeout: ${APP_CHAT_STREAM_TIMEOUT:5m}
    heartbeat-interval: ${APP_CHAT_HEARTBEAT_INTERVAL:15s}
    replay-retention: ${APP_CHAT_REPLAY_RETENTION:2m}
    flush-interval-ms: ${APP_CHAT_FLUSH_INTERVAL_MS:800}
    max-buffered-chunks: ${APP_CHAT_MAX_BUFFERED_CHUNKS:20000}
    fallback-enabled: ${APP_CHAT_FALLBACK_ENABLED:true}
    # 仅本地规则降级模式：每段之间的展示间隔，让没有模型密钥时也能看到增量推送；设 0 关闭。
    rule-chunk-delay: ${APP_CHAT_RULE_CHUNK_DELAY:25ms}
    executor:
      core-size: ${APP_CHAT_EXECUTOR_CORE:4}
      max-size: ${APP_CHAT_EXECUTOR_MAX:16}
      queue-capacity: ${APP_CHAT_EXECUTOR_QUEUE:200}
  travel:
    amap:
      base-url: ${AMAP_BASE_URL:https://restapi.amap.com}
      api-key: ${AMAP_API_KEY:}
    weather:
      # 和风天气项目专属 API Host，例如 https://xxxx.re.qweatherapi.com
      base-url: ${QWEATHER_API_HOST:}
      api-key: ${QWEATHER_API_KEY:}
  cors:
    # 前端独立部署时把正式域名加进来，多个用逗号分隔
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

management:
  endpoints:
    web:
      exposure:
        include: health,info
